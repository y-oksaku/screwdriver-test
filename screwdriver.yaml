shared:
  image: node:20
jobs:
  a-test1:
    steps:
      - test: echo 'test'
  a-test2:
    steps:
      - test: echo 'test'
  b-test:
    requires: [ stage@test-a ]
    steps:
      - test: echo 'test'
  c-test:
    steps:
      - test: echo 'test'

stages:
